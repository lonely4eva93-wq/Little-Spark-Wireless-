<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Little Spark Wireless</title>
  <style>
    :root { color-scheme: dark; --bg:#080b12; --card:#111827; --line:#263244; --text:#f8fafc; --muted:#9ca3af; --accent:#67e8f9; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: radial-gradient(circle at top, #12324a, var(--bg) 55%); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    main { width:min(900px,100%); background: color-mix(in srgb, var(--card) 88%, transparent); border:1px solid var(--line); border-radius:24px; box-shadow:0 24px 80px #0008; overflow:hidden; }
    header { padding:24px; border-bottom:1px solid var(--line); }
    h1 { margin:0 0 8px; font-size:clamp(28px, 6vw, 48px); letter-spacing:-.04em; }
    p { color:var(--muted); margin:0; line-height:1.55; }
    #chat { height:52vh; overflow:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
    .msg { padding:14px 16px; border:1px solid var(--line); border-radius:18px; max-width:82%; white-space:pre-wrap; line-height:1.45; }
    .user { align-self:flex-end; background:#0f766e; }
    .bot { align-self:flex-start; background:#0f172a; }
    form { display:flex; gap:10px; padding:16px; border-top:1px solid var(--line); }
    input { flex:1; border:1px solid var(--line); border-radius:16px; background:#020617; color:var(--text); padding:14px; font-size:16px; }
    button { border:0; border-radius:16px; padding:0 18px; font-weight:800; background:var(--accent); color:#06202a; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Little Spark Wireless ✨</h1>
      <p>ARC-ONE chat core online. Ask, build, sell, fix, and move.</p>
    </header>
    <section id="chat"><div class="msg bot">I’m awake. What are we building first?</div></section>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Message Little Spark…" />
      <button id="send">Send</button>
    </form>
  </main>
  <script>
    const chat = document.querySelector('#chat');
    const form = document.querySelector('#form');
    const input = document.querySelector('#input');
    const send = document.querySelector('#send');
    const messages = [];
    function add(role, text) {
      const el = document.createElement('div');
      el.className = `msg ${role === 'user' ? 'user' : 'bot'}`;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      messages.push({ role: 'user', content: text });
      add('user', text);
      send.disabled = true;
      try {
        const res = await fetch('/api/chat', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ messages }) });
        const data = await res.json();
        const reply = data.reply || data.error || 'No reply came back.';
        messages.push({ role:'assistant', content: reply });
        add('assistant', reply);
      } catch (err) {
        add('assistant', 'Connection error. Check the server logs and OPENAI_API_KEY.');
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
