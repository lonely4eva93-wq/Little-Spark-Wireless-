<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Little Spark Wireless</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
  <h1>⚡ Little Spark Wireless</h1>
  <p class="tagline">AI powered wireless dreams with signal and soul.</p>

  <div class="card">
    <h2>Live Spark Chat</h2>
    <div id="messages" class="messages"></div>

    <div class="inputRow">
      <input id="messageInput" type="text" placeholder="Send a spark..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <div class="card">
    <h2>Owner Panel</h2>
    <p>Status: Prototype Online</p>
    <div class="inputRow">
      <input id="ownerPinInput" type="password" placeholder="Owner PIN" />
      <button id="ownerLoginBtn">Unlock</button>
    </div>
    <div id="ownerTools" class="ownerTools hidden">
      <p>Owner mode unlocked.</p>
      <button id="saveLeadBtn">Save Lead</button>
      <button id="clearMessagesBtn">Clear Messages</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
